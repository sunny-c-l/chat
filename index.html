<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人房间</title>
  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2d2d44);
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      padding: 20px; color: #e0e0e0;
    }
    .container {
      background: #2a2a3d; border-radius: 24px; padding: 30px;
      width: 100%; max-width: 750px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; margin-bottom: 25px; color: #a78bfa; }
    .action-panel {
      background: #1f1f2e; border-radius: 16px; padding: 20px;
      margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .input {
      flex: 1; min-width: 150px; padding: 12px; border-radius: 10px;
      border: 2px solid #3f3f5e; background: #12121f; color: white;
      font-size: 16px; outline: none;
    }
    .input:focus { border-color: #a78bfa; }
    .btn {
      padding: 12px 24px; border: none; border-radius: 10px;
      font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .btn-create { background: #7c3aed; color: white; }
    .btn-create:hover { background: #6d28d9; }
    .btn-join { background: #10b981; color: white; }
    .btn-join:hover { background: #059669; }
    .btn-leave { background: #ef4444; color: white; }
    .btn-leave:hover { background: #dc2626; }
    .btn:disabled { background: #4b5563; cursor: not-allowed; }
    .info-box {
      display: flex; justify-content: space-between; align-items: center;
      background: #1f1f2e; border-radius: 12px; padding: 15px;
      margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
    }
    .my-id { font-family: monospace; background: #12121f; padding: 6px 12px; border-radius: 8px; }
    .copy-btn {
      background: #4b5563; color: white; border: none;
      padding: 6px 12px; border-radius: 8px; cursor: pointer; margin-left: 8px;
    }
    .copy-btn:hover { background: #6b7280; }
    .user-list {
      background: #1f1f2e; border-radius: 12px; padding: 12px;
      margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 8px;
    }
    .user-badge {
      background: #374151; padding: 6px 14px; border-radius: 20px;
      font-size: 14px; color: #d1d5db;
    }
    .user-badge.self { background: #7c3aed; color: white; }
    .chat-box {
      background: #12121f; border-radius: 16px; height: 350px;
      overflow-y: auto; padding: 15px; margin-bottom: 15px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .message { max-width: 75%; padding: 10px 16px; border-radius: 18px; line-height: 1.4; }
    .message.sent { align-self: flex-end; background: #7c3aed; color: white; }
    .message.received { align-self: flex-start; background: #374151; color: #e5e7eb; }
    .message.system {
      align-self: center; background: #1f2937; color: #9ca3af;
      font-style: italic; font-size: 13px; max-width: 90%;
    }
    .sender-name { font-size: 12px; margin-bottom: 4px; opacity: 0.8; display: block; }
    .input-section { display: flex; gap: 10px; }
    #messageInput {
      flex: 1; padding: 12px; border-radius: 10px;
      border: 2px solid #3f3f5e; background: #12121f;
      color: white; font-size: 16px; outline: none;
    }
    #messageInput:focus { border-color: #a78bfa; }
    .send-btn {
      padding: 12px 25px; border-radius: 10px;
      background: #7c3aed; color: white; font-weight: bold;
      border: none; cursor: pointer;
    }
    .send-btn:hover { background: #6d28d9; }
    .send-btn:disabled { background: #4b5563; cursor: not-allowed; }
    .footer-note { text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280; }
    .invite-link {
      display: flex; align-items: center; gap: 8px; margin-top: 10px;
    }
    .invite-link input {
      flex: 1; background: #12121f; border: 1px solid #3f3f5e;
      border-radius: 8px; padding: 8px 12px; color: #a78bfa; font-size: 14px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>多人房间</h1>

  <!-- 操作区 -->
  <div class="action-panel" id="actionPanel">
    <input class="input" type="text" id="hostIdInput" placeholder="输入房主的 Peer ID（不填则自己创建）">
    <button class="btn btn-create" id="createBtn">🏠 创建房间</button>
    <button class="btn btn-join" id="joinBtn">🚪 加入房间</button>
    <button class="btn btn-leave" id="leaveBtn" disabled>退出房间</button>
  </div>

  <!-- 我的信息 & 邀请链接（房主可见） -->
  <div class="info-box">
    <div>
      <span style="color:#9ca3af;">🆔 我的ID：</span>
      <span class="my-id" id="myPeerId">——</span>
      <button class="copy-btn" onclick="copyId()">📋 复制</button>
    </div>
    <div id="inviteSection" style="display:none;" class="invite-link">
      <span style="color:#9ca3af;">🔗 邀请链接：</span>
      <input type="text" id="inviteLinkInput" readonly>
      <button class="copy-btn" onclick="copyInviteLink()">复制</button>
    </div>
  </div>

  <div>
    <span style="color:#9ca3af; margin-bottom:5px; display:block;">👥 在线成员：</span>
    <div class="user-list" id="userList">
      <span style="color:#6b7280;">暂无</span>
    </div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="message system">等待加入房间...</div>
  </div>

  <div class="input-section">
    <input type="text" id="messageInput" placeholder="输入消息..." disabled>
    <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">发送</button>
  </div>
  <p class="footer-note">
    ⚡ PeerJS 公共信令云 · 房主分享邀请链接即可加入 · 建议 ≤8 人
  </p>
</div>

<script>
  // ---------- 全局变量 ----------
  let peer = null;
  let myPeerId = null;
  let nickname = 'User' + Math.floor(Math.random() * 1000);
  let isHost = false;
  const connections = new Map(); // key: remotePeerId, value: DataConnection

  // UI
  const hostIdInput = document.getElementById('hostIdInput');
  const createBtn = document.getElementById('createBtn');
  const joinBtn = document.getElementById('joinBtn');
  const leaveBtn = document.getElementById('leaveBtn');
  const myPeerIdSpan = document.getElementById('myPeerId');
  const inviteSection = document.getElementById('inviteSection');
  const inviteLinkInput = document.getElementById('inviteLinkInput');
  const userListDiv = document.getElementById('userList');
  const chatBox = document.getElementById('chatBox');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');

  // ---------- 辅助函数 ----------
  function addSystemMsg(text) {
    const div = document.createElement('div');
    div.className = 'message system';
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addChatMsg(sender, text, isSelf) {
    const div = document.createElement('div');
    div.className = `message ${isSelf ? 'sent' : 'received'}`;
    const nameSpan = document.createElement('span');
    nameSpan.className = 'sender-name';
    nameSpan.textContent = sender;
    div.appendChild(nameSpan);
    div.appendChild(document.createTextNode(text));
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function updateUserList() {
    userListDiv.innerHTML = '';
    const selfBadge = document.createElement('span');
    selfBadge.className = 'user-badge self';
    selfBadge.textContent = `${nickname} (我)`;
    userListDiv.appendChild(selfBadge);
    for (let [peerId, conn] of connections) {
      const badge = document.createElement('span');
      badge.className = 'user-badge';
      badge.textContent = conn.metadata?.nickname || peerId.substring(0, 8);
      userListDiv.appendChild(badge);
    }
  }

  function broadcastMessage(msg) {
    const data = { type: 'chat', sender: nickname, text: msg };
    for (let conn of connections.values()) {
      if (conn.open) conn.send(data);
    }
    addChatMsg(nickname, msg, true);
  }

  function sendIntro(conn) {
    conn.send({ type: 'intro', nickname: nickname });
  }

  // ---------- 连接处理（核心全连接逻辑） ----------
  function setupConnection(conn) {
    conn.on('open', () => {
      sendIntro(conn);

      if (isHost) {
        // 房主处理新连接
        connections.set(conn.peer, conn);
        updateUserList();

        // 发送成员列表给新成员（包含房主自己 + 已有所有成员）
        const memberList = [{ id: myPeerId, nickname: nickname }];
        for (let [id, c] of connections) {
          if (c.open && id !== conn.peer) {
            memberList.push({ id: id, nickname: c.metadata?.nickname || id.substring(0, 8) });
          }
        }
        conn.send({ type: 'member-list', members: memberList });

        // 广播新成员给老成员，让他们主动连接
        const newMemberInfo = {
          type: 'new-member',
          id: conn.peer,
          nickname: conn.metadata?.nickname || conn.peer.substring(0, 8)
        };
        for (let [id, c] of connections) {
          if (id !== conn.peer && c.open) c.send(newMemberInfo);
        }
      } else {
        // 非房主：直接保存连接
        connections.set(conn.peer, conn);
        updateUserList();
      }
    });

    conn.on('data', (data) => {
      if (data.type === 'intro') {
        conn.metadata = { nickname: data.nickname };
        updateUserList();
        addSystemMsg(`${data.nickname} 加入了房间`);
      } else if (data.type === 'chat') {
        addChatMsg(data.sender, data.text, false);
      } else if (data.type === 'member-list') {
        // 新加入者收到房主发来的成员列表，连接所有人（跳过自己）
        data.members.forEach(member => {
          if (member.id === myPeerId || connections.has(member.id)) return;
          const newConn = peer.connect(member.id, {
            reliable: true,
            metadata: { nickname: nickname }
          });
          setupConnection(newConn);
        });
        updateUserList();
      } else if (data.type === 'new-member') {
        // 老成员收到新成员通知，主动连接新成员
        if (data.id === myPeerId || connections.has(data.id)) return;
        const newConn = peer.connect(data.id, {
          reliable: true,
          metadata: { nickname: nickname }
        });
        setupConnection(newConn);
      }
    });

    conn.on('close', () => {
      addSystemMsg(`${conn.metadata?.nickname || conn.peer.substring(0,8)} 离开了房间`);
      connections.delete(conn.peer);
      updateUserList();
    });

    conn.on('error', (err) => {
      console.error(`连接 ${conn.peer} 错误:`, err);
      addSystemMsg(`与 ${conn.metadata?.nickname || conn.peer.substring(0,8)} 的连接出错`);
      connections.delete(conn.peer);
      updateUserList();
    });
  }

  // ---------- 创建房间（房主） ----------
  function createRoom() {
    leaveRoom(); // 清空旧状态
    nickname = prompt('设置你的昵称:', nickname) || nickname;
    peer = new Peer(); // 随机 ID

    peer.on('open', (id) => {
      myPeerId = id;
      myPeerIdSpan.textContent = id;
      isHost = true;

      // 生成邀请链接
      const inviteUrl = `${location.origin}${location.pathname}?host=${id}`;
      inviteLinkInput.value = inviteUrl;
      inviteSection.style.display = 'flex';

      addSystemMsg(`房间已创建，你的 ID: ${id}`);
      addSystemMsg(`将邀请链接发给朋友即可加入`);

      // UI 状态
      createBtn.disabled = true;
      joinBtn.disabled = true;
      leaveBtn.disabled = false;
      hostIdInput.disabled = true;
      messageInput.disabled = false;
      sendBtn.disabled = false;
    });

    peer.on('connection', (conn) => {
      if (isHost) setupConnection(conn);
      else setupConnection(conn); // 非房主也可能收到连接（安全起见）
    });

    peer.on('error', (err) => {
      console.error('Peer 错误:', err);
      addSystemMsg(`❌ 错误: ${err.type} - ${err.message}`);
    });

    peer.on('disconnected', () => {
      addSystemMsg('与信令服务器断开，尝试重连...');
      peer.reconnect();
    });
  }

  // ---------- 加入房间（输入房主 ID 或通过链接自动加入） ----------
  function joinRoom(hostId) {
    leaveRoom();
    if (!hostId) {
      hostId = hostIdInput.value.trim();
    }
    if (!hostId) {
      alert('请输入房主的 Peer ID 或通过邀请链接加入');
      return;
    }
    nickname = prompt('设置你的昵称:', nickname) || nickname;

    peer = new Peer(); // 随机 ID
    peer.on('open', (myId) => {
      myPeerId = myId;
      myPeerIdSpan.textContent = myId;
      isHost = false;

      addSystemMsg(`正在连接房主 ${hostId}...`);

      const conn = peer.connect(hostId, {
        reliable: true,
        metadata: { nickname: nickname }
      });
      setupConnection(conn);

      // UI 状态
      createBtn.disabled = true;
      joinBtn.disabled = true;
      leaveBtn.disabled = false;
      hostIdInput.disabled = true;
      messageInput.disabled = false;
      sendBtn.disabled = false;
    });

    peer.on('connection', (conn) => {
      if (!isHost) setupConnection(conn);
    });

    peer.on('error', (err) => {
      console.error('Peer 错误:', err);
      addSystemMsg(`❌ 错误: ${err.type} - ${err.message}`);
    });
  }

  function leaveRoom() {
    for (let conn of connections.values()) conn.close();
    connections.clear();
    if (peer) {
      peer.destroy();
      peer = null;
    }
    // 重置 UI
    myPeerIdSpan.textContent = '——';
    inviteSection.style.display = 'none';
    userListDiv.innerHTML = '<span style="color:#6b7280;">暂无</span>';
    chatBox.innerHTML = '<div class="message system">等待加入房间...</div>';
    createBtn.disabled = false;
    joinBtn.disabled = false;
    leaveBtn.disabled = true;
    hostIdInput.disabled = false;
    messageInput.disabled = true;
    sendBtn.disabled = true;
    isHost = false;
  }

  // ---------- 事件绑定 ----------
  createBtn.addEventListener('click', createRoom);
  joinBtn.addEventListener('click', () => joinRoom(null));
  leaveBtn.addEventListener('click', () => {
    if (confirm('确定要退出房间吗？')) leaveRoom();
  });

  window.sendMessage = function() {
    const msg = messageInput.value.trim();
    if (!msg) return;
    broadcastMessage(msg);
    messageInput.value = '';
  };

  window.copyId = function() {
    const id = myPeerIdSpan.textContent;
    if (!id || id === '——') return;
    navigator.clipboard.writeText(id).then(() => alert('ID 已复制'));
  };

  window.copyInviteLink = function() {
    navigator.clipboard.writeText(inviteLinkInput.value).then(() => alert('邀请链接已复制，快发给朋友吧！'));
  };

  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
  });

  // 自动检测 URL 中的 host 参数，自动加入
  (function autoJoinFromUrl() {
    const params = new URLSearchParams(location.search);
    const hostId = params.get('host');
    if (hostId) {
      hostIdInput.value = hostId;
      // 延迟一小会儿确保 DOM 加载完毕
      setTimeout(() => joinRoom(hostId), 500);
    }
  })();
</script>
</body>
</html>
