<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人房间</title>
  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap');

    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --border: #d0d0d0;
      --text: #1a1a1a;
      --text-secondary: #555;
      --accent: #2b7a78;
      --accent-hover: #1f5f5d;
      --danger: #c0392b;
      --danger-hover: #a93226;
      --join: #27ae60;
      --join-hover: #1e8449;
      --chat-bg: #f0f2f5;
      --msg-sent: #dcf8c6;
      --msg-received: #ffffff;
      --system-bg: #e9ecef;
      --system-text: #6c757d;
      --self-badge: #2b7a78;
      --user-badge-bg: #e0e0e0;
      --user-badge-text: #333;
      --input-bg: #fff;
      --input-border: #ccc;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --toolbar-bg: #f9f9f9;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.light):not(.dark) {
        --bg: #1e1e2f;
        --surface: #2a2a3d;
        --border: #3f3f5e;
        --text: #e0e0e0;
        --text-secondary: #aaa;
        --accent: #4dd0e1;
        --accent-hover: #26c6da;
        --danger: #ef5350;
        --danger-hover: #e53935;
        --join: #66bb6a;
        --join-hover: #43a047;
        --chat-bg: #12121f;
        --msg-sent: #1e3a3a;
        --msg-received: #374151;
        --system-bg: #1f2937;
        --system-text: #9ca3af;
        --self-badge: #4dd0e1;
        --user-badge-bg: #374151;
        --user-badge-text: #d1d5db;
        --input-bg: #12121f;
        --input-border: #3f3f5e;
        --shadow: 0 2px 12px rgba(0,0,0,0.4);
        --toolbar-bg: #1e1e2f;
      }
    }
    body.dark {
      --bg: #1e1e2f;
      --surface: #2a2a3d;
      --border: #3f3f5e;
      --text: #e0e0e0;
      --text-secondary: #aaa;
      --accent: #4dd0e1;
      --accent-hover: #26c6da;
      --danger: #ef5350;
      --danger-hover: #e53935;
      --join: #66bb6a;
      --join-hover: #43a047;
      --chat-bg: #12121f;
      --msg-sent: #1e3a3a;
      --msg-received: #374151;
      --system-bg: #1f2937;
      --system-text: #9ca3af;
      --self-badge: #4dd0e1;
      --user-badge-bg: #374151;
      --user-badge-text: #d1d5db;
      --input-bg: #12121f;
      --input-border: #3f3f5e;
      --shadow: 0 2px 12px rgba(0,0,0,0.4);
      --toolbar-bg: #1e1e2f;
    }
    body.light {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --border: #d0d0d0;
      --text: #1a1a1a;
      --text-secondary: #555;
      --accent: #2b7a78;
      --accent-hover: #1f5f5d;
      --danger: #c0392b;
      --danger-hover: #a93226;
      --join: #27ae60;
      --join-hover: #1e8449;
      --chat-bg: #f0f2f5;
      --msg-sent: #dcf8c6;
      --msg-received: #ffffff;
      --system-bg: #e9ecef;
      --system-text: #6c757d;
      --self-badge: #2b7a78;
      --user-badge-bg: #e0e0e0;
      --user-badge-text: #333;
      --input-bg: #fff;
      --input-border: #ccc;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --toolbar-bg: #f9f9f9;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, 'Noto Color Emoji', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
      position: relative;
    }
    .container {
      display: flex;
      width: 100%;
      max-width: 1200px;
      height: 90vh;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: background 0.3s;
    }

    .sidebar {
      width: 300px;
      padding: 20px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: var(--surface);
    }
    .sidebar h2 { font-size: 1.2rem; font-weight: 600; color: var(--text); }
    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      border: none;
      font-weight: 600;
      cursor: pointer;
      background: var(--input-bg);
      color: var(--text);
      transition: all 0.2s;
    }
    .btn-accent { background: var(--accent); color: white; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-join { background: var(--join); color: white; }
    .btn-join:hover { background: var(--join-hover); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .invite-box { display: flex; flex-direction: column; gap: 6px; }
    .invite-url {
      background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; font-size: 13px;
      color: var(--accent); word-break: break-all;
    }
    .user-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow-y: auto; }
    .user-badge {
      background: var(--user-badge-bg); color: var(--user-badge-text);
      padding: 4px 12px; border-radius: 20px; font-size: 13px;
      display: flex; align-items: center; gap: 6px;
    }
    .user-badge.self { background: var(--self-badge); color: white; }
    .kick-btn {
      background: transparent; border: none; color: #f87171;
      font-weight: bold; cursor: pointer; padding: 0 2px;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
    }
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .message-row.sent { justify-content: flex-end; }
    .message-row.received { justify-content: flex-start; }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .message {
      max-width: 75%;
      padding: 10px 16px;
      border-radius: 18px;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
      font-size: 14px;
      position: relative;
    }
    .message.sent { background: var(--msg-sent); color: var(--text); }
    .message.received { background: var(--msg-received); color: var(--text); border: 1px solid var(--border); }
    .message.system {
      align-self: center;
      background: var(--system-bg);
      color: var(--system-text);
      font-style: italic;
      font-size: 13px;
      max-width: 85%;
      text-align: center;
    }
    .sender-name { font-size: 12px; margin-bottom: 4px; opacity: 0.8; display: block; font-weight: 500; }
    .message img {
      max-width: 240px;
      max-height: 240px;
      border-radius: 12px;
      margin-top: 4px;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .message img:hover { transform: scale(1.02); }
    .file-download {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 4px;
      font-size: 13px;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.2s;
    }

    .image-lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
    }
    .image-lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 12px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 8px 20px;
      background: var(--toolbar-bg);
      border-top: 1px solid var(--border);
      position: relative;
    }
    .toolbar-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      color: var(--text);
      transition: background 0.2s;
    }
    .toolbar-btn:hover { background: var(--user-badge-bg); }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 10px 20px 15px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    #messageInput {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text);
      resize: vertical;
      min-height: 44px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
    }
    #messageInput:focus { border-color: var(--accent); }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      box-shadow: var(--shadow);
      z-index: 20;
    }

    .github-link {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      text-decoration: none;
      font-size: 24px;
      box-shadow: var(--shadow);
      transition: all 0.2s;
      z-index: 20;
    }
    .github-link:hover { transform: scale(1.1); color: var(--accent); }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle" title="切换深色/浅色模式">🌓</div>

  <a href="https://github.com/sunny-c-l/chat/" target="_blank" class="github-link" title="GitHub 仓库">
    <i class="fab fa-github"></i>
  </a>

  <div class="container">
    <div class="sidebar">
      <h2>⚡ 房间控制</h2>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-accent" id="createBtn">🏠 创建房间</button>
        <button class="btn btn-join" id="joinBtn">🚪 加入房间</button>
      </div>
      <button class="btn btn-danger" id="leaveBtn" disabled>退出房间</button>

      <div class="invite-box" id="inviteSection" style="display:none;">
        <label style="color: var(--text-secondary); font-size:0.85rem;">🔗 邀请链接</label>
        <div class="invite-url" id="inviteLinkInput"></div>
        <button class="btn" style="padding:4px 10px; font-size:12px;" onclick="copyInviteLink()">复制链接</button>
      </div>

      <div>
        <label style="color: var(--text-secondary); font-size:0.85rem; display:block; margin-bottom:6px;">👥 在线成员</label>
        <div class="user-list" id="userList">
          <span style="color: var(--text-secondary);">暂无</span>
        </div>
      </div>

      <div style="margin-top: auto;">
        <label style="color: var(--text-secondary); font-size:0.85rem; display:block; margin-bottom:6px;">🧑 头像设置</label>
        <div style="display: flex; align-items: center; gap: 8px;">
          <img id="avatarPreview" src="" alt="头像" style="width:40px; height:40px; border-radius:50%; object-fit:cover; background: #ccc;">
          <button class="btn" style="padding:4px 10px; font-size:12px;" onclick="document.getElementById('avatarInput').click()">上传</button>
          <button class="btn" style="padding:4px 10px; font-size:12px;" onclick="generateRandomAvatar()">随机</button>
          <input type="file" id="avatarInput" accept="image/*" style="display:none">
        </div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-messages" id="chatBox">
        <div class="message system">等待加入房间...</div>
      </div>

      <div class="toolbar" id="toolbar">
        <button class="toolbar-btn" id="emojiBtn" title="表情">😀</button>
        <button class="toolbar-btn" id="imageBtn" title="发送图片（显示为图片）">🖼️</button>
        <button class="toolbar-btn" id="fileBtn" title="发送文件（图片也显示为文件）">📎</button>
      </div>

      <div class="input-area">
        <textarea id="messageInput" placeholder="输入消息... (Shift+Enter 换行，Enter 发送)" disabled></textarea>
        <button class="btn btn-accent" id="sendBtn" disabled onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <input type="file" id="imageInput" accept="image/*" style="display:none">
  <input type="file" id="fileInput" style="display:none">

  <script>
    (() => {
      const PING_INTERVAL = 5000;
      const SAFE_CHUNK_SIZE = 15 * 1024;
      const CONCURRENT_CHUNKS = 4;
      const MAX_FILE_SIZE = 80 * 1024 * 1024; // 80MB

      let peer = null, myPeerId = null;
      let nickname = 'User' + Math.floor(Math.random()*1000);
      let isHost = false;
      const connections = new Map();
      const fileBuffers = new Map();

      // 主题
      function applyTheme(mode) {
        document.body.classList.remove('light', 'dark');
        if (mode === 'dark') document.body.classList.add('dark');
        else if (mode === 'light') document.body.classList.add('light');
      }
      const savedTheme = localStorage.getItem('chat-theme');
      if (savedTheme) {
        applyTheme(savedTheme);
      } else {
        document.body.classList.remove('light', 'dark');
      }
      const themeToggle = document.getElementById('themeToggle');
      themeToggle.addEventListener('click', () => {
        if (document.body.classList.contains('dark')) {
          applyTheme('light');
          localStorage.setItem('chat-theme', 'light');
        } else {
          applyTheme('dark');
          localStorage.setItem('chat-theme', 'dark');
        }
      });

      // 头像
      let myAvatarDataUrl = generateRandomAvatar();
      const avatarPreview = document.getElementById('avatarPreview');
      avatarPreview.src = myAvatarDataUrl;

      function generateRandomAvatar() {
        const canvas = document.createElement('canvas');
        canvas.width = 100; canvas.height = 100;
        const ctx = canvas.getContext('2d');
        const hue = Math.floor(Math.random() * 360);
        const colors = [
          `hsl(${hue}, 70%, 60%)`,
          `hsl(${hue}, 80%, 70%)`,
          `hsl(${hue}, 60%, 50%)`,
          `hsl(${hue}, 90%, 80%)`
        ];
        for (let i = 0; i < 12; i++) {
          ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
          const x = Math.random() * 100, y = Math.random() * 100;
          const size = Math.random() * 40 + 10;
          ctx.beginPath();
          if (Math.random() > 0.5) ctx.arc(x, y, size/2, 0, Math.PI*2);
          else ctx.fillRect(x - size/2, y - size/2, size, size);
          ctx.fill();
        }
        return canvas.toDataURL('image/png');
      }
      window.generateRandomAvatar = () => {
        myAvatarDataUrl = generateRandomAvatar();
        avatarPreview.src = myAvatarDataUrl;
      };

      document.getElementById('avatarInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const max = 100;
            let w = img.width, h = img.height;
            if (w > h) { h = h * max / w; w = max; }
            else { w = w * max / h; h = max; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            myAvatarDataUrl = canvas.toDataURL('image/png');
            avatarPreview.src = myAvatarDataUrl;
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      const $ = id => document.getElementById(id);
      const createBtn = $('createBtn'), joinBtn = $('joinBtn'), leaveBtn = $('leaveBtn');
      const inviteSection = $('inviteSection'), inviteLinkInput = $('inviteLinkInput');
      const userListDiv = $('userList'), chatBox = $('chatBox'), messageInput = $('messageInput'), sendBtn = $('sendBtn');
      const emojiBtn = $('emojiBtn'), imageInput = $('imageInput'), fileInput = $('fileInput');
      const imageBtn = $('imageBtn'), fileBtn = $('fileBtn');
      const toolbar = $('toolbar');

      let originalTitle = document.title, unread = false, flashInterval = null;
      function addSystemMsg(text) {
        const d = document.createElement('div'); d.className='message system'; d.textContent=text;
        chatBox.appendChild(d); chatBox.scrollTop = chatBox.scrollHeight;
      }
      function addChatMsg(sender, text, avatar, isSelf) {
        const row = document.createElement('div');
        row.className = `message-row ${isSelf ? 'sent' : 'received'}`;
        const img = document.createElement('img'); img.src = avatar || generateRandomAvatar(); img.className = 'avatar';
        const bubble = document.createElement('div'); bubble.className = `message ${isSelf ? 'sent' : 'received'}`;
        const nameSpan = document.createElement('span'); nameSpan.className='sender-name'; nameSpan.textContent=sender;
        bubble.appendChild(nameSpan);
        const content = document.createElement('span'); content.textContent = text;
        bubble.appendChild(content);
        if (isSelf) { row.appendChild(bubble); row.appendChild(img); }
        else { row.appendChild(img); row.appendChild(bubble); }
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        if (!isSelf && document.hidden) startTitleFlash();
      }
      function addImageMsg(sender, dataUrl, avatar, isSelf) {
        const row = document.createElement('div');
        row.className = `message-row ${isSelf ? 'sent' : 'received'}`;
        const img = document.createElement('img'); img.src = avatar || generateRandomAvatar(); img.className = 'avatar';
        const bubble = document.createElement('div'); bubble.className = `message ${isSelf ? 'sent' : 'received'}`;
        const nameSpan = document.createElement('span'); nameSpan.className='sender-name'; nameSpan.textContent=sender;
        bubble.appendChild(nameSpan);
        const image = document.createElement('img'); image.src = dataUrl;
        image.addEventListener('click', () => showLightbox(dataUrl));
        bubble.appendChild(image);
        if (isSelf) { row.appendChild(bubble); row.appendChild(img); }
        else { row.appendChild(img); row.appendChild(bubble); }
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        if (!isSelf && document.hidden) startTitleFlash();
      }
      function addFileMsg(sender, fileName, fileUrl, fileSize, avatar, isSelf) {
        const row = document.createElement('div');
        row.className = `message-row ${isSelf ? 'sent' : 'received'}`;
        const img = document.createElement('img'); img.src = avatar || generateRandomAvatar(); img.className = 'avatar';
        const bubble = document.createElement('div'); bubble.className = `message ${isSelf ? 'sent' : 'received'}`;
        const nameSpan = document.createElement('span'); nameSpan.className='sender-name'; nameSpan.textContent=sender;
        bubble.appendChild(nameSpan);
        const link = document.createElement('a'); link.href=fileUrl; link.download=fileName; link.className='file-download';
        link.textContent=`📄 ${fileName} (${formatSize(fileSize)})`; bubble.appendChild(link);
        if (isSelf) { row.appendChild(bubble); row.appendChild(img); }
        else { row.appendChild(img); row.appendChild(bubble); }
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        if (!isSelf && document.hidden) startTitleFlash();
      }
      function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        else if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
        else if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
        else return (bytes/1073741824).toFixed(2) + ' GB';
      }
      function startTitleFlash() {
        if (unread) return; unread = true;
        flashInterval = setInterval(() => {
          document.title = document.title === originalTitle ? '🔔 新消息！' : originalTitle;
        }, 1000);
      }
      function stopTitleFlash() {
        clearInterval(flashInterval); flashInterval = null;
        document.title = originalTitle; unread = false;
      }
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && unread) stopTitleFlash();
      });
      function showLightbox(src) {
        const existing = document.querySelector('.image-lightbox');
        if (existing) existing.remove();
        const lb = document.createElement('div');
        lb.className = 'image-lightbox';
        const img = document.createElement('img');
        img.src = src;
        lb.appendChild(img);
        lb.addEventListener('click', () => lb.remove());
        document.body.appendChild(lb);
      }

      function updateUserList() {
        userListDiv.innerHTML = '';
        const selfBadge = document.createElement('span'); selfBadge.className='user-badge self'; selfBadge.textContent=`${nickname} (我)`;
        userListDiv.appendChild(selfBadge);
        for (let [peerId, conn] of connections) {
          if (!conn.open) continue;
          const badge = document.createElement('span'); badge.className='user-badge';
          badge.textContent = conn.metadata?.nickname || peerId.substring(0,8);
          if (isHost) {
            const kickBtn = document.createElement('button'); kickBtn.className='kick-btn'; kickBtn.textContent='✕';
            kickBtn.title='踢出';
            kickBtn.onclick = (e) => { e.stopPropagation(); if(confirm(`踢出 ${badge.textContent}?`)) kickMember(peerId); };
            badge.appendChild(kickBtn);
          }
          userListDiv.appendChild(badge);
        }
      }
      function kickMember(peerId) {
        const conn = connections.get(peerId); if (!conn) return;
        try { conn.send({type:'kick'}); } catch(e) {}
        conn.close();
      }
      function sendLeaveToAll() {
        for (let conn of connections.values()) {
          if (conn.open) try { conn.send({type:'leave'}); } catch(e) {}
        }
      }

      // 心跳
      function startHeartbeat(conn) {
        stopHeartbeat(conn);
        const sendPing = () => {
          if (!conn.open) { stopHeartbeat(conn); return; }
          if (conn._awaitingPong) {
            conn._heartbeatLost = true;
            conn.close();
            handleConnectionLost(conn);
            return;
          }
          conn.send({type:'ping'});
          conn._awaitingPong = true;
        };
        sendPing();
        conn._pingInterval = setInterval(sendPing, PING_INTERVAL);
      }
      function stopHeartbeat(conn) {
        if (conn._pingInterval) { clearInterval(conn._pingInterval); conn._pingInterval = null; }
        conn._awaitingPong = false;
      }
      function handleConnectionLost(conn) {
        const peerId = conn.peer;
        if (!connections.has(peerId)) return;
        const remoteNick = conn.metadata?.nickname || peerId.substring(0,8);
        addSystemMsg(`${remoteNick} 连接已丢失`);
        connections.delete(peerId);
        stopHeartbeat(conn);
        updateUserList();
        if (isHost) {
          for (let [,c] of connections) if (c.open) c.send({type:'user-lost', id:peerId, nickname:remoteNick});
        }
      }

      // 文件传输（含80MB限制）
      async function sendFile(file, forceFile = false) {
        if (file.size > MAX_FILE_SIZE) {
          alert(`文件大小不能超过 80MB！当前文件大小: ${formatSize(file.size)}`);
          return;
        }

        const fileId = Date.now() + '-' + Math.random().toString(36).substr(2,6);
        const totalChunks = Math.ceil(file.size / SAFE_CHUNK_SIZE);
        const row = document.createElement('div'); row.className = 'message-row sent';
        const bubble = document.createElement('div'); bubble.className = 'message sent';
        bubble.innerHTML = `<span class="sender-name">${nickname}</span>
          <div>📤 发送中: ${file.name} (${formatSize(file.size)})</div>
          <div class="progress-bar"><div class="progress-fill" id="progress-${fileId}" style="width:0%"></div></div>`;
        const ava = document.createElement('img'); ava.src = myAvatarDataUrl; ava.className = 'avatar';
        row.appendChild(bubble); row.appendChild(ava);
        chatBox.appendChild(row); chatBox.scrollTop = chatBox.scrollHeight;

        let completed = 0;
        const updateProgress = () => {
          const percent = (completed / totalChunks) * 100;
          const fill = document.getElementById(`progress-${fileId}`);
          if (fill) fill.style.width = percent + '%';
        };

        const buffer = await file.arrayBuffer();
        const chunks = [];
        for (let i = 0; i < totalChunks; i++) {
          const start = i * SAFE_CHUNK_SIZE;
          const end = Math.min(start + SAFE_CHUNK_SIZE, buffer.byteLength);
          const chunkBuffer = buffer.slice(start, end);
          const base64 = arrayBufferToBase64(chunkBuffer);
          chunks.push({
            type: 'file',
            fileId, fileName: file.name, fileSize: file.size,
            mimeType: file.type || 'application/octet-stream',
            chunkIndex: i, totalChunks,
            data: base64,
            displayAsFile: forceFile
          });
        }

        for (let i = 0; i < totalChunks; i += CONCURRENT_CHUNKS) {
          const batch = chunks.slice(i, i + CONCURRENT_CHUNKS).map(msg => {
            return new Promise(resolve => {
              for (let conn of connections.values()) if (conn.open) conn.send(msg);
              completed++;
              updateProgress();
              resolve();
            });
          });
          await Promise.all(batch);
          await new Promise(r => setTimeout(r, 0));
        }

        row.remove();
        if (file.type.startsWith('image/') && !forceFile) {
          const reader = new FileReader();
          reader.onload = () => addImageMsg(nickname, reader.result, myAvatarDataUrl, true);
          reader.readAsDataURL(file);
        } else {
          addFileMsg(nickname, file.name, '#', file.size, myAvatarDataUrl, true);
        }
      }
      function arrayBufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }
      function base64ToArrayBuffer(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes.buffer;
      }

      function handleFileChunkReceived(data, sender, senderAvatar) {
        const { fileId, fileName, fileSize, mimeType, chunkIndex, totalChunks, data: base64, displayAsFile } = data;
        if (!fileBuffers.has(fileId)) {
          fileBuffers.set(fileId, {
            fileName, fileSize, mimeType,
            chunks: new Map(), totalChunks,
            sender, senderAvatar, displayAsFile,
            progressRow: null
          });
          const row = document.createElement('div'); row.className = 'message-row received';
          const ava = document.createElement('img'); ava.src = senderAvatar || generateRandomAvatar(); ava.className = 'avatar';
          const bubble = document.createElement('div'); bubble.className = 'message received';
          bubble.innerHTML = `<span class="sender-name">${sender}</span>
            <div>📥 接收中: ${fileName} (${formatSize(fileSize)})</div>
            <div class="progress-bar"><div class="progress-fill" id="recv-progress-${fileId}" style="width:0%"></div></div>`;
          row.appendChild(ava); row.appendChild(bubble);
          chatBox.appendChild(row); chatBox.scrollTop = chatBox.scrollHeight;
          fileBuffers.get(fileId).progressRow = row;
        }
        const buf = fileBuffers.get(fileId);
        buf.chunks.set(chunkIndex, base64);
        const percent = (buf.chunks.size / totalChunks) * 100;
        const fill = document.getElementById(`recv-progress-${fileId}`);
        if (fill) fill.style.width = percent + '%';

        if (buf.chunks.size === totalChunks) {
          if (buf.progressRow) buf.progressRow.remove();
          const chunksArray = [];
          for (let i = 0; i < totalChunks; i++) chunksArray.push(base64ToArrayBuffer(buf.chunks.get(i)));
          const merged = new Uint8Array(chunksArray.reduce((acc, arr) => acc + arr.byteLength, 0));
          let offset = 0;
          for (const arr of chunksArray) { merged.set(new Uint8Array(arr), offset); offset += arr.byteLength; }
          const blob = new Blob([merged], { type: mimeType });
          const url = URL.createObjectURL(blob);
          if (mimeType.startsWith('image/') && !buf.displayAsFile) {
            addImageMsg(sender, url, senderAvatar, false);
          } else {
            addFileMsg(sender, fileName, url, fileSize, senderAvatar, false);
          }
          fileBuffers.delete(fileId);
        }
      }

      // 表情
      let emojiPickerInstance = null;
      emojiBtn.addEventListener('click', () => {
        if (!emojiPickerInstance) {
          emojiPickerInstance = document.createElement('emoji-picker');
          emojiPickerInstance.style.position = 'absolute';
          emojiPickerInstance.style.bottom = '50px';
          emojiPickerInstance.style.left = '0';
          emojiPickerInstance.style.zIndex = '100';
          toolbar.style.position = 'relative';
          toolbar.appendChild(emojiPickerInstance);
          emojiPickerInstance.addEventListener('emoji-click', event => {
            const emoji = event.detail.unicode;
            if (emoji) { messageInput.value += emoji; messageInput.focus(); }
            if (emojiPickerInstance) { emojiPickerInstance.remove(); emojiPickerInstance = null; }
          });
        } else {
          emojiPickerInstance.remove();
          emojiPickerInstance = null;
        }
      });
      document.addEventListener('click', (e) => {
        if (emojiPickerInstance && !emojiPickerInstance.contains(e.target) && e.target !== emojiBtn) {
          emojiPickerInstance.remove();
          emojiPickerInstance = null;
        }
      });

      // 文件选择（含80MB限制）
      imageBtn.addEventListener('click', () => imageInput.click());
      imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > MAX_FILE_SIZE) {
            alert(`文件大小不能超过 80MB！当前文件大小: ${formatSize(file.size)}`);
            imageInput.value = '';
            return;
          }
          sendFile(file, false);
        }
        imageInput.value = '';
      });
      fileBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > MAX_FILE_SIZE) {
            alert(`文件大小不能超过 80MB！当前文件大小: ${formatSize(file.size)}`);
            fileInput.value = '';
            return;
          }
          sendFile(file, true);
        }
        fileInput.value = '';
      });

      // 连接处理
      function setupConnection(conn) {
        conn._receivedLeave = false;
        conn._heartbeatLost = false;
        conn.on('open', () => {
          conn.send({type:'intro', nickname:nickname, avatar: myAvatarDataUrl});
          startHeartbeat(conn);
          if (!isHost && myPeerId && conn.peer) {
            inviteLinkInput.textContent = `${location.origin}${location.pathname}?host=${conn.peer}`;
            inviteSection.style.display = 'block';
          }
        });
        conn.on('data', data => {
          if (data.type === 'pong') { conn._awaitingPong = false; return; }
          if (data.type === 'ping') { if (conn.open) conn.send({type:'pong'}); return; }
          if (data.type === 'leave') {
            conn._receivedLeave = true;
            addSystemMsg(`${conn.metadata?.nickname || conn.peer.substring(0,8)} 离开了房间`);
            conn.close(); return;
          }
          if (data.type === 'intro') {
            conn.metadata = { nickname: data.nickname, avatar: data.avatar };
            if (isHost) {
              const newNick = data.nickname;
              const existNicks = new Set([nickname]);
              for (let [,c] of connections) if (c.open && c.metadata?.nickname) existNicks.add(c.metadata.nickname);
              if (existNicks.has(newNick)) {
                conn.send({type:'name-rejected', reason:'昵称重复，请更换'});
                conn.close();
                addSystemMsg(`${newNick} 昵称重复被拒绝`);
                return;
              }
              connections.set(conn.peer, conn);
              updateUserList(); addSystemMsg(`${newNick} 加入了房间`);
              const list = [{id:myPeerId, nickname:nickname, avatar: myAvatarDataUrl}];
              for (let [id,c] of connections) if (c.open && id !== conn.peer) list.push({id, nickname: c.metadata?.nickname, avatar: c.metadata?.avatar});
              conn.send({type:'member-list', members:list});
              for (let [id,c] of connections) if (id !== conn.peer && c.open) c.send({type:'new-member', id:conn.peer, nickname:newNick, avatar: myAvatarDataUrl});
            } else {
              connections.set(conn.peer, conn);
              updateUserList(); addSystemMsg(`${data.nickname} 加入了房间`);
            }
          }
          else if (data.type === 'chat') {
            addChatMsg(data.sender, data.text, conn.metadata?.avatar, false);
          }
          else if (data.type === 'member-list') {
            data.members.forEach(m => {
              if (m.id === myPeerId || connections.has(m.id)) return;
              const nc = peer.connect(m.id, {reliable:true, metadata:{nickname:nickname}});
              setupConnection(nc);
            });
            updateUserList();
          }
          else if (data.type === 'new-member') {
            if (data.id === myPeerId || connections.has(data.id)) return;
            const nc = peer.connect(data.id, {reliable:true, metadata:{nickname:nickname}});
            setupConnection(nc);
          }
          else if (data.type === 'kick') { alert('你已被房主踢出房间'); leaveRoom(); }
          else if (data.type === 'user-kicked') {
            if (connections.has(data.id)) connections.get(data.id).close();
          }
          else if (data.type === 'user-lost') {
            if (connections.has(data.id)) {
              const c = connections.get(data.id);
              c._receivedLeave = true;
              c.close();
              handleConnectionLost(c);
            }
          }
          else if (data.type === 'file') {
            const senderNick = conn.metadata?.nickname || conn.peer.substring(0,8);
            const senderAvatar = conn.metadata?.avatar;
            handleFileChunkReceived(data, senderNick, senderAvatar);
          }
          else if (data.type === 'name-rejected') {
            alert(`加入失败：${data.reason}`);
            conn.close();
            if (peer) peer.destroy();
            leaveRoom();
          }
        });
        conn.on('close', () => {
          const remoteNick = conn.metadata?.nickname || conn.peer.substring(0,8);
          const peerId = conn.peer;
          stopHeartbeat(conn);
          if (!conn._receivedLeave) {
            if (connections.has(peerId)) {
              addSystemMsg(`${remoteNick} 连接已丢失`);
              connections.delete(peerId);
              updateUserList();
              if (isHost) {
                for (let [,c] of connections) if (c.open) c.send({type:'user-lost', id:peerId, nickname:remoteNick});
              }
            }
          } else {
            connections.delete(peerId);
            updateUserList();
          }
        });
        conn.on('error', () => { if (conn.open) conn.close(); });
      }

      function createRoom() {
        leaveRoom();
        nickname = prompt('设置昵称:', nickname) || nickname;
        peer = new Peer();
        peer.on('open', id => {
          myPeerId = id; isHost = true;
          inviteLinkInput.textContent = `${location.origin}${location.pathname}?host=${id}`;
          inviteSection.style.display = 'block';
          addSystemMsg(`房间已创建，分享邀请链接给朋友`);
          createBtn.disabled = joinBtn.disabled = true; leaveBtn.disabled = false;
          messageInput.disabled = sendBtn.disabled = false;
        });
        peer.on('connection', conn => setupConnection(conn));
        peer.on('error', err => addSystemMsg(`错误: ${err.type}`));
        peer.on('disconnected', () => { addSystemMsg('信令断线，重连中...'); peer.reconnect(); });
      }
      function joinRoom(hostId) {
        leaveRoom();
        if (!hostId) return;
        nickname = prompt('设置昵称:', nickname) || nickname;
        peer = new Peer();
        peer.on('open', myId => {
          myPeerId = myId; isHost = false;
          addSystemMsg(`连接房主...`);
          const conn = peer.connect(hostId, {reliable:true, metadata:{nickname:nickname}});
          setupConnection(conn);
          createBtn.disabled = joinBtn.disabled = true; leaveBtn.disabled = false;
          messageInput.disabled = sendBtn.disabled = false;
        });
        peer.on('connection', conn => setupConnection(conn));
        peer.on('error', err => addSystemMsg(`错误: ${err.type}`));
        peer.on('disconnected', () => { addSystemMsg('信令断线，重连中...'); peer.reconnect(); });
      }
      function leaveRoom() {
        stopTitleFlash();
        sendLeaveToAll();
        for (let conn of connections.values()) { stopHeartbeat(conn); conn.close(); }
        connections.clear();
        if (peer) { peer.destroy(); peer = null; }
        inviteSection.style.display = 'none';
        userListDiv.innerHTML = '<span style="color: var(--text-secondary);">暂无</span>';
        chatBox.innerHTML = '<div class="message system">等待加入房间...</div>';
        createBtn.disabled = joinBtn.disabled = false; leaveBtn.disabled = true;
        messageInput.disabled = sendBtn.disabled = true;
        isHost = false;
      }

      window.sendMessage = () => {
        const msg = messageInput.value;
        if (!msg.trim()) return;
        const data = {type:'chat', sender:nickname, text: msg};
        for (let conn of connections.values()) if (conn.open) conn.send(data);
        addChatMsg(nickname, msg, myAvatarDataUrl, true);
        messageInput.value = '';
        messageInput.style.height = 'auto';
      };
      messageInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!sendBtn.disabled) sendMessage();
        }
      });
      messageInput.addEventListener('input', () => {
        messageInput.style.height = 'auto';
        messageInput.style.height = messageInput.scrollHeight + 'px';
      });
      window.copyInviteLink = () => navigator.clipboard.writeText(inviteLinkInput.textContent);
      createBtn.addEventListener('click', createRoom);
      joinBtn.addEventListener('click', () => {
        const hostId = prompt('请输入房主 Peer ID：');
        if (hostId) joinRoom(hostId.trim());
      });
      leaveBtn.addEventListener('click', () => { if (confirm('退出房间？')) leaveRoom(); });

      const params = new URLSearchParams(location.search);
      const hostParam = params.get('host');
      if (hostParam) setTimeout(() => joinRoom(hostParam.trim()), 500);
    })();
  </script>
</body>
</html>
